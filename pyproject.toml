[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
name = "polyfriture"
description = "A Friture fork for real-time audio monitoring and visualization"
license = {file = "COPYING.txt"}
readme = "README.rst"
authors = [
    {name = "Will Hirsch", email = "contact@willh.uk"},
]
maintainers = [{name = "Will Hirsch"}]
keywords = ["audio", "spectrum", "spectrogram"]
classifiers=[
    "Programming Language :: Python",
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Speech"
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "sounddevice==0.5.5",
    "rtmixer==0.1.7",
    "docutils==0.23",
    "numpy==2.4.6",
    "PyQt6",
    "platformdirs==4.11.1",
    "pyrr==0.10.3",
    "pyinstaller==6.21.0"
]

[project.scripts]
polyfriture = "polyfriture.analyzer:main"

[project.urls]
Homepage = "https://github.com/WillHirsch/polyfriture"
Repository = "https://github.com/WillHirsch/polyfriture"
Issues = "https://github.com/WillHirsch/polyfriture/issues"
Upstream = "https://github.com/tlecomte/friture"

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["polyfriture/test"]
python_files = ["test_*.py"]

[tool.setuptools]
packages=[
    "polyfriture",
    "polyfriture.data",
    "polyfriture.playback",
    "polyfriture.plotting",
    "polyfriture.generators",
    "polyfriture.signal",
]

[tool.setuptools.data-files]
"share/applications" = ["appimage/polyfriture.desktop"]

[tool.setuptools.dynamic]
version = {attr = "polyfriture.__version__"}
