name: build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: "auto"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Display Python version
      run: uv run python -c "import sys; print(sys.version)"

    - name: Inspect Build Environment
      shell: powershell
      run: Write-Host $env:PATH

    - name: Enable Visual Studio Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build
      shell: powershell
      run: ./.github/workflows/install-windows.ps1

    - name: Verify app launches (smoke test)
      # Launch the frozen friture-monitor.exe headless (offscreen Qt) and assert it
      # reaches full init. The MSIX itself is not installed here (it is
      # unsigned; the Store signs on ingestion) -- we validate the same frozen
      # binary the MSIX wraps.
      shell: bash
      run: uv run python scripts/smoke_test.py dist/friture-monitor/friture-monitor.exe --no-splash

    - name: Capture friture-monitor log
      if: always()
      shell: bash
      run: |
        uv run python - <<'PY'
        import os, shutil, platformdirs
        src = os.path.join(platformdirs.user_log_dir("friture-monitor", ""), "friture-monitor.log.txt")
        dst = "friture-monitor-smoke.log"
        if os.path.exists(src):
            shutil.copy2(src, dst)
        else:
            with open(dst, "w") as f:
                f.write("log not found: " + src)
        PY

    - name: Upload friture-monitor smoke-test log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: friture-monitor-smoke-log-windows
        path: friture-monitor-smoke.log
        if-no-files-found: warn

    - name: Upload friture-monitor msix
      uses: actions/upload-artifact@v7
      with:
        name: friture-monitor-msix
        path: dist/friture-monitor-*.msix
        if-no-files-found: error

    - name: Upload friture-monitor msi
      uses: actions/upload-artifact@v7
      with:
        name: friture-monitor-msi
        path: dist/friture-monitor-*.msi
        if-no-files-found: error

    - name: Upload friture-monitor zip
      uses: actions/upload-artifact@v7
      with:
        name: friture-monitor-zip
        path: dist/friture-monitor.zip
        if-no-files-found: error

    - name: Upload import xref
      uses: actions/upload-artifact@v7
      with:
        name: friture-monitor-import-xref
        path: build/friture-monitor/xref-friture-monitor.html
        if-no-files-found: error

    - name: Upload import graph
      uses: actions/upload-artifact@v7
      with:
        name: friture-monitor-import-graph
        path: build/friture-monitor/graph-friture-monitor.dot
        if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: "auto"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Display Python version
      run: uv run python -c "import sys; print(sys.version)"

    - name: Build
      run: source ./.github/workflows/install-linux.sh

    - name: Verify AppImage launches (smoke test)
      run: |
        ./friture-monitor-*.AppImage --appimage-extract
        uv run python scripts/smoke_test.py ./squashfs-root/AppRun --no-splash

    - name: Capture friture-monitor log
      if: always()
      shell: bash
      run: |
        uv run python - <<'PY'
        import os, shutil, platformdirs
        src = os.path.join(platformdirs.user_log_dir("friture-monitor", ""), "friture-monitor.log.txt")
        dst = "friture-monitor-smoke.log"
        if os.path.exists(src):
            shutil.copy2(src, dst)
        else:
            with open(dst, "w") as f:
                f.write("log not found: " + src)
        PY

    - name: Upload AppImage smoke-test log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: friture-monitor-smoke-log-linux
        path: friture-monitor-smoke.log
        if-no-files-found: warn

    - name: Upload appImage
      uses: actions/upload-artifact@v7
      with:
        name: friture-monitor-appImage
        path: |
          friture-monitor*.AppImage
          friture-monitor*.AppImage.zsync
        if-no-files-found: error

  build-macos:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: "auto"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Display Python version
      run: uv run python -c "import sys; print(sys.version)"

    - name: Build
      run: source ./.github/workflows/install-macos.sh

    - name: Verify app launches (smoke test)
      shell: bash
      run: uv run python scripts/smoke_test.py dist/friture-monitor.app/Contents/MacOS/friture-monitor --no-splash

    - name: Capture friture-monitor log
      if: always()
      shell: bash
      run: |
        uv run python - <<'PY'
        import os, shutil, platformdirs
        src = os.path.join(platformdirs.user_log_dir("friture-monitor", ""), "friture-monitor.log.txt")
        dst = "friture-monitor-smoke.log"
        if os.path.exists(src):
            shutil.copy2(src, dst)
        else:
            with open(dst, "w") as f:
                f.write("log not found: " + src)
        PY

    - name: Upload friture-monitor smoke-test log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: friture-monitor-smoke-log-macos
        path: friture-monitor-smoke.log
        if-no-files-found: warn

    - name: Upload dmg
      uses: actions/upload-artifact@v7
      with:
        name: friture-monitor-dmg
        path: friture-monitor*.dmg
        if-no-files-found: error

  release:
    name: Create release and upload artifacts
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v8

      - name: Display structure of downloaded files
        run: ls -R

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') # Limit releases to pushes to tags
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            **/friture-monitor*.msi
            **/friture-monitor*.msix
            **/friture-monitor*.dmg
            **/friture-monitor*.AppImage
            **/friture-monitor*.AppImage.zsync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
